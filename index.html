<style>
/* Layout: toy control panel. Header with obstacle name + difficulty, a light illustration-board stage, a caption, test picker */
:root{
  --bg:#E9ECF3; --panel:#F6F7FB; --fg:#22263A; --muted:#6A7088; --line:#C6CCDB; --accent:#3F4FD8; --chip:#FFFFFF;
  --ink:#2A2340; --btn:#F0533D; --btn-hi:#FFB8AA; --board:#DDE3EE; --easy:#1E9E62; --mid:#D98A10; --hard:#D2343A;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151827; --panel:#1E2236; --fg:#E8EAF4; --muted:#9AA0BC; --line:#3A4162; --accent:#8C98FF; --chip:#2C3250; --board:#C6CDDD;
  --easy:#4FD198; --mid:#F2B544; --hard:#FF6B6F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151827; --panel:#1E2236; --fg:#E8EAF4; --muted:#9AA0BC; --line:#3A4162; --accent:#8C98FF; --chip:#2C3250; --board:#C6CDDD;
  --easy:#4FD198; --mid:#F2B544; --hard:#FF6B6F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:-.5px;text-wrap:balance}
header p{margin:3px 0 0;color:var(--muted);font-size:13px}
.top{display:flex;gap:8px;align-items:stretch}
.now{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px}
.now .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.lvl{font-family:var(--display);font-size:13px;border-radius:99px;padding:1px 9px;color:var(--panel)}
.lvl.l0{background:var(--easy)} .lvl.l1{background:var(--mid)} .lvl.l2{background:var(--hard)}
.now .nm{font-family:var(--display);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skip{border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:14px;padding:0 14px;font-family:var(--display);font-size:16px;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--muted);font-family:var(--display);font-size:15px;padding:7px 0;border-radius:9px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--fg);color:var(--panel)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stage{--fg:#22263A;--muted:#5D6480;--line:#AEB5C8;--chip:#FFFFFF;--panel:#F6F7FB;--accent:#3F4FD8;
  position:relative;height:460px;border-radius:24px;background:var(--board);color:var(--fg);overflow:hidden;user-select:none;-webkit-user-select:none;
  border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);touch-action:none;-webkit-touch-callout:none}
.cap{min-height:48px;font-family:var(--display);font-size:19px;text-align:center;text-wrap:balance;padding:0 6px}
.stats{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
details.list{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
details.list summary{cursor:pointer;font-family:var(--display);font-size:16px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:10px}
.chip{text-align:left;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:10px;padding:7px 9px;font-family:var(--body);font-size:13px;cursor:pointer;min-width:0}
.chip b{font-family:var(--display);font-weight:400;color:var(--accent);margin-right:4px;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}

/* the button: flat red circle, thick ink outline */
.big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:126px;height:126px;border-radius:50%;padding:0;
  background:var(--btn);border:3.5px solid var(--ink);box-shadow:0 7px 0 var(--ink);color:#fff;font-family:var(--display);font-size:23px;
  cursor:pointer;touch-action:none;-webkit-touch-callout:none;transition:scale .2s,opacity .3s,background .3s;z-index:2}
.big::before{content:"";position:absolute;left:20%;top:15%;width:24%;height:13%;border-radius:50%;background:var(--btn-hi);rotate:-25deg;pointer-events:none}
.big span{position:relative;pointer-events:none;text-shadow:0 2px 0 var(--ink)}
.big:active{translate:0 5px;box-shadow:0 2px 0 var(--ink)}
.big.inline{position:relative;left:auto;top:auto;transform:none}
.big.mini{width:50px;height:50px;font-size:12px;border-width:2.5px;box-shadow:0 4px 0 var(--ink)}
.big.mini:active{translate:0 3px;box-shadow:0 1px 0 var(--ink)}
.big.mid{width:94px;height:94px;font-size:19px}
.big.gray{background:#A3A8BE} .big.gray::before{background:#D6D9E4}
.big.burnt{background:#7A3A2C} .big.burnt::before{background:#A86A5A}
.big.nope{background:#A3A8BE;box-shadow:0 2px 0 var(--ink)} .big.nope::before{background:#D6D9E4}
.big.mover{transition:left .22s cubic-bezier(.3,1.4,.6,1),top .22s cubic-bezier(.3,1.4,.6,1),scale .2s}
.big.sleepy{background:#C9776C;animation:breathe 2.4s ease-in-out infinite}
.big.flip span{display:inline-block;rotate:180deg}
.big.mirror span{display:inline-block;scale:-1 -1}
.big.pop{animation:pop .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{scale:.2}}
@keyframes breathe{50%{scale:.94}}
.shake{animation:shake .35s}
@keyframes shake{20%{rotate:-9deg}50%{rotate:8deg}80%{rotate:-4deg}}

.spr{position:absolute;transform:translate(-50%,-50%);z-index:3;cursor:pointer;touch-action:none}
.spr svg{width:100%;height:100%;display:block;overflow:visible}
.drag{cursor:grab}
.held{cursor:grabbing;z-index:9!important;filter:drop-shadow(0 6px 0 rgba(42,35,64,.25))}
.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.layer line{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.layer .rope{stroke:#A0703A;stroke-width:6}
.layer .fline{stroke:#4A4F66;stroke-width:1.5}
.layer .cable{stroke:var(--ink);stroke-width:5}
.layer .thread{stroke:#E8A0B4;stroke-width:4}
.tools{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px;z-index:6}
.tool{border:2.5px solid var(--ink);background:var(--chip);color:var(--fg);border-radius:99px;padding:9px 15px;font-family:var(--display);font-size:17px;cursor:pointer;touch-action:manipulation;box-shadow:0 3px 0 var(--ink)}
.tool:active{translate:0 2px;box-shadow:0 1px 0 var(--ink)}
.tool.primary{background:var(--accent);color:#fff}
.tool:disabled{opacity:.45;cursor:default}
.field{border:2.5px solid var(--ink);background:var(--chip);color:var(--fg);border-radius:99px;padding:9px 14px;font-family:var(--body);font-size:16px;width:150px;min-width:0}
.bubble{position:absolute;left:50%;transform:translateX(-50%);background:var(--chip);border:2.5px solid var(--ink);border-radius:14px;padding:6px 12px;font-family:var(--display);font-size:17px;white-space:nowrap;z-index:4}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(42,35,64,.35);z-index:8}
.modal .box{background:var(--panel);border:3px solid var(--ink);border-radius:18px;padding:18px;width:min(270px,86%);text-align:center;box-shadow:0 6px 0 var(--ink)}
.modal .box p{margin:0 0 14px;font-family:var(--display);font-size:20px;text-wrap:balance}
.modal .box .mq{font-size:13px;color:var(--muted);margin-bottom:6px;font-family:var(--body)}
.row{display:flex;gap:8px;justify-content:center}
.col{display:flex;flex-direction:column;gap:8px}
.win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(246,247,251,.95);z-index:20;animation:fade .35s;text-align:center;padding:20px}
.win h2{font-family:var(--display);font-weight:400;font-size:26px;margin:6px 0 14px;text-wrap:balance;line-height:1.3}
.win .k{font-family:var(--display);color:var(--btn);font-size:19px;margin:0}
.win dl{display:grid;grid-template-columns:auto auto;gap:4px 14px;justify-content:center;margin:0 0 18px;font-size:14px}
.win dt{color:var(--muted)} .win dd{margin:0;font-variant-numeric:tabular-nums;text-align:left}
@keyframes fade{from{opacity:0}}
.grid{position:absolute;inset:18px 14px;display:grid;place-items:center;gap:6px}
.grid2{position:absolute;inset:30px 20px 60px;display:grid;place-items:center}
.scroller{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain}
.tall{position:relative}
.sign{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:16px;color:var(--muted);white-space:nowrap}
.closed{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-4deg);width:190px;padding:22px 10px;background:#F4E7B8;color:#4a3b10;border:3px solid var(--ink);border-radius:8px;text-align:center;font-family:var(--display);font-size:26px;z-index:4;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:top .6s ease-in,rotate .6s}
.closed small{display:block;font-family:var(--body);font-size:12px;margin-top:4px}
.meter{position:absolute;left:28px;right:28px;top:22%;height:28px;border-radius:99px;background:var(--chip);border:3px solid var(--ink);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:#7FD6A4}
.meter .mark{position:absolute;top:0;bottom:0;width:5px;background:var(--ink)}
.ring{position:absolute;left:50%;top:50%;width:168px;height:168px;transform:translate(-50%,-50%);border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),transparent 0);z-index:1}
.cover{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:170px;height:170px;border-radius:50%;z-index:4;cursor:pointer;touch-action:none;border:3.5px solid var(--ink)}
.ice{background:#CFE8FF;box-shadow:inset 14px 10px 0 -6px #fff}
.knit{overflow:hidden;display:flex;flex-direction:column}
.knit i{flex:1;transition:flex .25s}
.dark{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),transparent 0,transparent var(--r,60px),rgba(12,10,24,.985) calc(var(--r,60px) + 18px))}
.water{position:absolute;left:0;right:0;bottom:0;background:#7EC1F2;border-top:3px solid var(--ink);z-index:1}
.drain{position:absolute;transform:translate(-50%,-50%);width:84px;height:48px;border:3px solid var(--ink);border-radius:8px;background:repeating-linear-gradient(90deg,#8C90A6 0 8px,#5B5F75 8px 12px);color:#fff;font-family:var(--display);font-size:14px;display:grid;place-items:center;text-shadow:0 1px 0 var(--ink);z-index:2}
.card{position:absolute;transform:translate(-50%,-50%);perspective:800px;cursor:pointer;touch-action:none}
.card .in{position:absolute;inset:0;transition:transform .7s;transform-style:preserve-3d}
.card.flipped .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;background:var(--chip);border:3px solid var(--ink);padding:12px 14px;box-shadow:0 4px 0 var(--ink);overflow:hidden}
.face.back{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;text-align:center}
.face h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:20px}
.face p{margin:0;font-size:13px;line-height:1.5}
.stamp{position:absolute;right:10px;top:10px;width:30px;height:38px;border:2px dashed var(--muted);border-radius:4px;background:#FFE3A8}
.slots{position:absolute;left:0;right:0;top:16px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;z-index:5;padding:0 10px}
.slot{width:66px;height:76px;border:2.5px solid var(--ink);background:var(--chip);border-radius:10px;font-family:var(--display);font-size:15px;color:var(--fg);cursor:pointer;position:relative}
.slot.done::after{content:"승인";position:absolute;left:50%;bottom:6px;margin-left:-22px;width:44px;height:44px;line-height:40px;border:3px solid var(--hard);color:var(--hard);border-radius:50%;rotate:-14deg;font-size:14px}
.ticker{position:absolute;left:0;right:0;top:18px;text-align:center;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.spark{position:absolute;left:24px;top:68px;height:60px;width:calc(100% - 48px)}
.steps{position:absolute;left:24px;right:24px;top:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;z-index:2}
.steps div{color:var(--muted)} .steps div.on{color:var(--fg);font-weight:700}
.bar{position:absolute;left:30px;right:30px;top:42%;height:24px;border-radius:99px;background:var(--chip);border:3px solid var(--ink);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0}
.barlbl{position:absolute;left:0;right:0;top:calc(42% + 32px);text-align:center;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.mbar{position:absolute;width:90px;height:14px;transform:translate(-50%,-50%);border-radius:99px;background:var(--chip);border:2.5px solid var(--ink);overflow:hidden;z-index:4}
.mbar i{position:absolute;inset:0 auto 0 0;background:#7FD6A4;width:0}
.terms{position:absolute;left:16px;right:16px;top:16px;height:210px;overflow:auto;background:var(--chip);border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;touch-action:pan-y}
.terms h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:17px}
.terms p{margin:0 0 8px}
.chk{position:absolute;left:16px;right:16px;display:flex;gap:8px;align-items:center;font-size:14px;touch-action:manipulation}
.chk input{width:20px;height:20px;flex:none}
.notes{position:absolute;left:24px;right:24px;top:20px;font-size:14px;line-height:1.7;margin:0;padding-left:18px}
.sticker{position:absolute;width:150px;padding:14px 6px;transform:translate(-50%,-50%);background:#FFF;color:#C0182A;border:3px solid #C0182A;outline:3px solid var(--ink);text-align:center;font-family:var(--display);font-size:22px;z-index:4;cursor:grab;touch-action:none}
.sticker small{display:block;font-family:var(--body);font-size:11px;color:#333}
.peg{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#A0703A;border:3px solid var(--ink);z-index:2}
.peg::after{content:"말뚝";position:absolute;top:36px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:13px;color:var(--muted);white-space:nowrap}
.knot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#FFD23F;border:3px solid var(--ink);z-index:5;cursor:grab;touch-action:none}
.yarn{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#E8A0B4;border:3px solid var(--ink);z-index:6;cursor:grab;touch-action:none}
.mat{position:absolute;transform:translate(-50%,-50%);border:3px dashed var(--ink);border-radius:14px;background:#3B3F57;color:#fff;font-family:var(--display);font-size:15px;display:grid;place-items:center;z-index:1;opacity:.85}
.pond{position:absolute;left:0;right:0;top:90px;bottom:0;background:#6FB3E8;border-top:3px solid var(--ink);z-index:0}
.pond::before{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:#C8A46A;border-top:3px solid var(--ink)}
.dashc{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:3px dashed #8A90A8;z-index:1}
canvas.draw{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.sil{position:absolute;transform:translate(-50%,-50%);width:128px;height:128px;border-radius:50%;border:3px dashed #8A90A8;z-index:1}
.wedge{position:absolute;width:140px;height:140px;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.wedge svg{width:100%;height:100%;display:block;overflow:visible}
.wedge path{pointer-events:visiblePainted;cursor:grab}
.fall{transition:top .8s ease-in,rotate .8s,opacity .8s!important;opacity:0}
.tugline{position:absolute;top:0;bottom:0;width:0;border-left:3px dashed #8A90A8;z-index:0}
.blanket{position:absolute;transform:translate(-50%,-50%);width:150px;height:66px;border:3px solid var(--ink);border-radius:14px;background:repeating-linear-gradient(90deg,#9FD1B8 0 18px,#F6F7FB 18px 36px);z-index:4;cursor:grab;touch-action:none}
.hitline{position:absolute;left:20px;right:20px;height:0;border-top:4px solid var(--ink);z-index:1}
.note{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:#6E7CF2;border:3px solid var(--ink);z-index:2}
.note::after{content:"♪";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px}
.mball{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#6E7CF2;border:3px solid var(--ink);z-index:5;cursor:grab;touch-action:none}
.cage{position:absolute;transform:translate(-50%,-50%);width:156px;height:156px;border:4px solid var(--ink);border-radius:12px;background:repeating-linear-gradient(90deg,transparent 0 18px,#3B3F57 18px 25px);z-index:4}
.padlock{position:absolute;transform:translate(-50%,-50%);width:40px;height:34px;background:#F2C94C;border:3px solid var(--ink);border-radius:6px;z-index:5}
.padlock::before{content:"";position:absolute;left:50%;top:-20px;width:20px;height:20px;margin-left:-13px;border:3px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;transition:translate .3s}
.padlock.open::before{translate:0 -8px;rotate:20deg}
.padlock::after{content:"";position:absolute;left:50%;top:9px;width:6px;height:12px;margin-left:-3px;background:var(--ink);border-radius:3px}
.dial{position:absolute;margin:-92px 0 0 -92px;width:184px;height:184px;border-radius:50%;background:radial-gradient(circle,#B8BFD6 0 64%,transparent 64%),repeating-conic-gradient(from -1deg,#2A2340 0 2deg,#D7DBE6 2deg 9deg);padding:0;border:4px solid var(--ink);z-index:3;cursor:grab;touch-action:none;}
.dial span{position:absolute;left:50%;top:20px;width:26px;margin-left:-13px;height:68px;transform-origin:50% 72px;text-align:center;font-family:var(--display);font-size:14px;color:var(--ink);pointer-events:none}
.dial::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#8C90A6;border:3px solid var(--ink)}
.wallet{position:absolute;left:16px;bottom:84px;background:#FFF3A8;border:2.5px solid var(--ink);border-radius:10px;padding:4px 12px;font-family:var(--display);font-size:16px;z-index:5}

    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)});}

function puff(x,y,tx,ty){const p=sprite('puff',38,x,y);p.style.pointerEvents='none';p.style.transition='left .5s ease-out,top .5s ease-out,opacity .5s,scale .5s';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{pos(p,x+(tx-x)*.8,y+(ty-y)*.8);p.style.opacity=0;p.style.scale=1.8}));setTimeout(()=>p.remove(),520)}
const springBack=(e,x,y)=>{e.style.transition='left .3s,top .3s';pos(e,x,y);setTimeout(()=>e.style.transition='',320)};

  const flee=()=>{if(!b.locked||n>=need)return;n++;rpos(b);say(`${L[Math.min(n-1,L.length-1)]} (${n}/${need})`);

{name:'대리 버튼',story:'버튼이 신혼여행 중이라 대리가 근무합니다.',run(lv){const B=mkB(lv);const R=B(['팀장','사장'],['팀장','부장','사장'],['팀장','부장','상무','전무','사장']);

{name:'이용약관',story:'버튼을 누르려면 약관에 동의해야 합니다.',run(lv){const B=mkB(lv);

{name:'업데이트 중',story:'버튼이 업데이트 중입니다.',run(lv){const B=mkB(lv);const dur=B(4000,7000,12000);

{name:'수학 시험',story:'버튼이 수학 시험 공부 중이라 바쁩니다.',run(lv){

{name:'풍선 버튼',story:'버튼이 풍선에 매달려 날아가고 있어요.',run(lv){const B=mkB(lv);const lag=B(1,.4,.18),up=B(.03,.06,.1);
  const ly=layer(),s1=line(ly),s2=line(ly);const peg=add(el('div','peg'));pos(peg,W()/2,H()-40);const pA=[0,60,100][lv],pP=[1,5200,3200][lv];

{name:'방전된 버튼',story:'버튼 배터리가 0%입니다. 충전하세요.',run(lv){const B=mkB(lv);const need=B(2000,4000,7000);

{name:'택배 상자',story:'버튼이 택배 상자에 갇혔어요.',run(lv){const B=mkB(lv);const n=B(1,3,5);const cx=W()/2,cy=H()/2+10;
  const box=sprite('box',160,cx,cy);box.style.pointerEvents='none';const lid=sprite('lid',160,cx,cy-32);let left=n;
  const openLid=()=>{say('이제 뚜껑을 끌어서 여세요.');drag(lid,{end:(x,y)=>{if(dist(x,y,cx,cy-32)>100){lid.style.transition='left .4s,top .4s,opacity .4s,rotate .4s';pos(lid,x+(x<cx?-200:200),y-60);lid.style.rotate='40deg';lid.style.opacity=0;lid.style.pointerEvents='none';
    after(300,()=>{box.remove();const b=add(realBtn('짜잔','pop'));pos(b,cx,cy);say('상자에서 나왔어요. 뽁뽁이는 없었습니다.')})}else{springBack(lid,cx,cy-32);say('더 멀리 들어내세요.')}}})};
  lid.onclick=()=>{if(left)say('테이프부터 떼야 해요.')};
  for(let i=0;i<n;i++){const ox=cx+(n>1?rnd(-30,30):0),oy=cy-32+(n>1?rnd(-12,40):0);const tp=sprite('tape',150,ox,oy);tp.style.rotate=(n>1?rnd(-50,50):90)+'deg';tp.style.zIndex=5;
    drag(tp,{start:()=>tp.style.transition='',end:(x,y)=>{if(dist(x,y,ox,oy)>90){tp.style.transition='opacity .3s';tp.style.opacity=0;tp.style.pointerEvents='none';left--;say(left?`찍— 남은 테이프 ${left}개`:'테이프를 다 뗐어요.');if(!left)openLid()}else{springBack(tp,ox,oy);say('쫀득해서 잘 안 떨어져요. 더 당기세요.')}}})}
  say('테이프를 끌어서 떼어내세요.');
}},
{name:'낙엽 더미',story:'버튼이 낙엽에 파묻혔어요.',run(lv){const B=mkB(lv);const n=B(8,16,28);const cx=W()/2,cy=H()/2;
  const b=add(realBtn());center(b);b.locked=true;const C=['#F4A340','#E2603F','#F2C94C','#C5741F'];const ls=[];
  const addLeaf=(x,y)=>{const s=sprite('leaf',rnd(44,62),x,y,ART.leaf(pick(C)));s.style.pointerEvents='none';s.style.rotate=rnd(0,360)+'deg';ls.push(s)};
  for(let i=0;i<n;i++){const a=rnd(0,6.28),r=rnd(0,70);addLeaf(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}
  let down=false,lx=0,lyy=0;onStage('pointerdown',e=>{down=true;const p=sp(e);lx=p.x;lyy=p.y});onStage('pointerup',()=>down=false);onStage('pointercancel',()=>down=false);
  onStage('pointermove',e=>{if(!down||!b.locked)return;const p=sp(e),dx=p.x-lx,dy=p.y-lyy;lx=p.x;lyy=p.y;
    for(let i=ls.length-1;i>=0;i--){const s=ls[i];if(dist(gx(s),gy(s),p.x,p.y)<44){const nx=gx(s)+dx*1.5,ny=gy(s)+dy*1.5;pos(s,nx,ny);s.style.rotate=(parseFloat(s.style.rotate)+dx)+'deg';if(nx<-30||nx>W()+30||ny<-30||ny>H()+30){s.remove();ls.splice(i,1)}}}
    if(!ls.some(s=>dist(gx(s),gy(s),cx,cy)<80)){b.locked=false;say('낙엽을 다 치웠어요. 가을 냄새가 납니다.')}});
  if(lv===2)every(2200,()=>{if(b.locked&&ls.length<40){addLeaf(cx+rnd(-60,60),cy+rnd(-60,60));say('바람이 불어서 낙엽이 또 떨어졌어요.')}});
  b.addEventListener('click',()=>{if(b.locked)say('낙엽 때문에 안 눌려요.')});say('화면을 쓸어서 낙엽을 치우세요.');
}},
{name:'줄다리기',story:'문어가 버튼을 가져가려고 줄을 당기고 있어요.',run(lv){const B=mkB(lv);const pull=B(.00005,.00009,.00015);
  const tl=add(el('div','tugline'));tl.style.left=(W()*.25)+'px';const oc=sprite('octo',96,W()-52,H()/2);oc.style.pointerEvents='none';const ly=layer(),rope=line(ly,'rope');
  const b=add(realBtn('도와줘','mid'));b.locked=true;let p=.55,lx=null,done=false;
  onStage('pointerdown',e=>{lx=sp(e).x});onStage('pointerup',()=>lx=null);onStage('pointercancel',()=>lx=null);
  onStage('pointermove',e=>{if(lx==null||done)return;const x=sp(e).x,dx=x-lx;lx=x;if(dx<0)p+=dx/W()*1.1});
  loop(dt=>{if(done)return false;p+=pull*dt;if(p>=.95){p=.62;say('문어가 가져갈 뻔했어요! 왼쪽으로 쭉쭉 쓸어요.')}
    const bx=60+p*(W()-200);pos(b,bx,H()/2);setLine(rope,0,H()/2,W()-90,H()/2);
    if(p<=.06){done=true;b.locked=false;setLabel(b,'구출');rope.remove();tl.remove();oc.innerHTML=ART.octoSad;say('이겼어요! 문어가 삐졌습니다.')}});
  b.addEventListener('click',()=>{if(b.locked)say('줄다리기 중이에요!')});say('화면을 왼쪽으로 계속 쓸어서 줄을 당기세요. 점선 너머까지!');
}},
{name:'지워진 버튼',story:'누가 지우개로 버튼을 지워버렸어요. 다시 그려주세요.',levels:[1],run(lv){const tol=30;const cx=W()/2,cy=H()/2-10,R=70;
  const g=add(el('div','dashc'));pos(g,cx,cy);g.style.width=g.style.height=R*2+'px';
  const cv=add(el('canvas','draw')),dpr=window.devicePixelRatio||1;cv.width=W()*dpr;cv.height=H()*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);c.strokeStyle='#F0533D';c.lineWidth=8;c.lineCap='round';
  const pen=sprite('pencil',60,cx+R+15,cy-15);pen.style.pointerEvents='none';pen.style.zIndex=6;
  let drawing=false,acc=0,la=null,lp=null,done=false,off=false;const reset=()=>{acc=0;la=null};
  onStage('pointerdown',e=>{if(done)return;c.clearRect(0,0,W(),H());reset();off=false;drawing=true;lp=sp(e);la=null;try{stage.setPointerCapture(e.pointerId)}catch(_){}});
  onStage('pointermove',e=>{const p=sp(e);pos(pen,p.x+15,p.y-15);if(!drawing||done)return;const r=dist(p.x,p.y,cx,cy);
    c.beginPath();c.moveTo(lp.x,lp.y);c.lineTo(p.x,p.y);c.stroke();lp=p;
    if(Math.abs(r-R)>tol){if(!off&&acc!==0)say('점선에서 벗어났어요. 손을 떼고 다시 그려요.');off=true;return}if(off)return;
    const a=Math.atan2(p.y-cy,p.x-cx);if(la!=null){let d=a-la;if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;acc+=d}la=a;
    if(Math.abs(acc)>=Math.PI*2*.96){done=true;drawing=false;pen.remove();after(200,()=>{cv.remove();g.remove();const b=add(realBtn('그렸다','pop'));pos(b,cx,cy);b.style.width=b.style.height=R*2+'px';say('다시 그렸어요. 그림 실력이 대단하시네요.')})}});
  onStage('pointerup',()=>{if(!done&&drawing&&acc!==0&&!off)say('한 번에 이어서 그려야 해요.');drawing=false});
  say('점선을 따라 한 바퀴 그려서 버튼을 되살리세요.');
}},
{name:'진흙 범벅',story:'버튼이 진흙탕에서 놀다 왔어요.',run(lv){const B=mkB(lv);const n=B(5,10,18),hp=B(140,240,360);const cx=W()/2,cy=H()/2-20;
  const b=add(realBtn('꼬질'));pos(b,cx,cy);b.locked=true;const ms=[];
  for(let i=0;i<n;i++){const a=rnd(0,6.28),r=rnd(0,55);const s=sprite('mud',rnd(36,56),cx+Math.cos(a)*r,cy+Math.sin(a)*r);s.style.pointerEvents='none';s.style.rotate=rnd(0,360)+'deg';ms.push({e:s,h:hp})}
  const tx=W()-60,ty=H()-60,tw=sprite('towel',76,tx,ty);tw.style.zIndex=6;let lx=0,ly=0;
  drag(tw,{start:()=>{lx=gx(tw);ly=gy(tw)},move:(x,y)=>{if(!b.locked)return;const d=dist(x,y,lx,ly);lx=x;ly=y;tw.style.rotate=(Math.sin(x*.05)*12)+'deg';
    for(let i=ms.length-1;i>=0;i--){const m=ms[i];if(dist(gx(m.e),gy(m.e),x,y)<38){m.h-=d;m.e.style.opacity=Math.max(0,m.h/hp);if(m.h<=0){m.e.remove();ms.splice(i,1);if(ms.length)say(pick(['뽀득!','슥슥','깨끗해진다']))}}}
    if(!ms.length){b.locked=false;setLabel(b,'반짝');tw.classList.add('fall');tw.style.top='140%';say('깨끗해졌어요. 버튼이 거울 같아요.')}},end:()=>{if(b.locked)springBack(tw,tx,ty)}});
  b.addEventListener('click',()=>{if(b.locked)say('더러워서 누르기 싫죠? 먼저 닦아요.')});say('수건을 잡고 진흙 얼룩을 문질러 닦으세요.');
}},
{name:'연못에 빠진 버튼',story:'버튼이 연못에 빠졌어요. 낚아 올리세요.',run(lv){const B=mkB(lv);const nf=B(0,2,4);
  add(el('div','pond'));const ly=layer(),ln=line(ly,'fline');const hook=sprite('hook',46,W()/2,150);hook.style.zIndex=5;
  const b=add(realBtn('꼬르륵','mid'));b.locked=true;b.style.zIndex=3;let bx=rnd(70,W()-70),by=H()-66;pos(b,bx,by);
  const fish=[];const FC=['#FF9A3D','#F28CA0','#7CD67E','#F2C94C'];for(let i=0;i<nf;i++){const f=sprite('fish',58,rnd(40,W()-40),rnd(170,H()-150),ART.fish(pick(FC)));f.style.pointerEvents='none';fish.push({e:f,v:rnd(.05,.12)*(Math.random()<.5?-1:1)})}
  let hooked=false,landed=false;const upd=()=>setLine(ln,W()/2,0,gx(hook),gy(hook)-21);upd();drag(hook,{move:upd});
  loop(dt=>{if(landed)return false;fish.forEach(f=>{let x=gx(f.e)+f.v*dt*(lv===2?1.6:1);if(x<30||x>W()-30){f.v*=-1;x=Math.max(30,Math.min(W()-30,x))}pos(f.e,x,gy(f.e));f.e.style.scale=f.v>0?'-1 1':'1 1'});
    const hx=gx(hook)-6,hy=gy(hook)+14;
    if(!hooked&&dist(hx,hy,bx,by)<45){hooked=true;say('걸렸다! 위로 끌어올리세요.')}
    if(hooked){bx=hx;by=hy+44;pos(b,bx,by);
      for(const f of fish)if(dist(gx(f.e),gy(f.e),bx,by)<52){hooked=false;say('물고기가 쳐서 버튼이 다시 가라앉아요!');by=H()-66;b.style.transition='top 1s ease-in';pos(b,bx,by);after(1000,()=>b.style.transition='');break}
      if(hooked&&by<96){landed=true;hook.remove();ln.remove();b.style.transition='left .5s,top .5s';pos(b,W()/2,50+47);setLabel(b,'건졌다');after(300,()=>{b.locked=false});say('건졌어요! 물기 좀 닦고 누르세요.')}}});
  b.addEventListener('click',()=>{if(b.locked)say('물속이라 손이 안 닿아요. 낚시하세요.')});say(nf?'낚싯바늘을 끌어서 버튼을 건지세요. 물고기를 피하세요.':'낚싯바늘을 끌어서 버튼을 건지세요.');
}},
{name:'컵 속 버튼',story:'버튼이 컵 속에 숨었어요. 잘 따라가세요.',run(lv){const B=mkB(lv);const nc=B(3,3,4),swaps=B(4,8,14),spd=B(520,360,240);
  const xs=[...Array(nc)].map((_,i)=>(i+.5)*W()/nc),Y=H()*.5;const slot=[...Array(nc).keys()];
  const cups=xs.map(x=>{const c=sprite('cup',84,x,Y);c.style.zIndex=4;c.style.transition=`left ${spd}ms ease-in-out,top .3s`;return c});
  const hid=Math.floor(Math.random()*nc);const b=add(realBtn('','mini'));b.style.zIndex=2;b.locked=true;let phase='show';
  const lift=(c,up)=>pos(c,gx(c),up?Y-80:Y);
  const round=()=>{phase='show';pos(b,xs[slot[hid]],Y+18);b.style.opacity=1;lift(cups[hid],true);say('버튼은 여기 있어요. 잘 보세요.');
    after(1200,()=>{lift(cups[hid],false);after(350,()=>{b.style.opacity=0;phase='shuffle';let k=0;const sw=()=>{if(k>=swaps){phase='pick';say('어느 컵일까요?');return}k++;
      const i=Math.floor(Math.random()*nc);let j=Math.floor(Math.random()*(nc-1));if(j>=i)j++;const ci=slot.indexOf(i),cj=slot.indexOf(j);slot[ci]=j;slot[cj]=i;pos(cups[ci],xs[j],Y);pos(cups[cj],xs[i],Y);after(spd+40,sw)};sw()})})};
  cups.forEach((c,ci)=>c.onclick=()=>{if(phase!=='pick')return;lift(c,true);if(ci===hid){phase='done';pos(b,xs[slot[ci]],Y+18);b.style.opacity=1;b.locked=false;say('찾았다! 눌러주세요.')}
    else{phase='wait';miss();say('꽝! 다시 섞을게요.');after(900,()=>{lift(c,false);after(400,round)})}});
  round();
}},
];

{name:'모기 습격',story:'모기가 버튼 주위를 윙윙 날아다녀요.',run(lv){const B=mkB(lv);const n=B(1,2,4),v=B(.14,.22,.32);

{name:'거미줄',story:'버튼이 거미줄에 걸렸어요.',run(lv){const B=mkB(lv);const n=B(4,8,12);const cx=W()/2,cy=H()/2;

{name:'계약서 서명',story:'버튼을 누르려면 계약서에 서명해야 해요.',levels:[1],run(lv){const need=150;
  const doc=add(el('div','qbox','<small>계약서</small>갑(버튼)은 을(당신)에게 한 번 눌림을 허락한다. 을은 아무 일도 일어나지 않음에 동의한다.'));doc.style.fontSize='15px';
  const px=20,py=150,pw=W()-40,ph=160;const pad=add(el('div','sigpad','서명란'));Object.assign(pad.style,{left:px+'px',top:py+'px',width:pw+'px',height:ph+'px'});
  const [cv,c]=mkCanvas();cv.style.zIndex=4;c.strokeStyle='#2A2340';c.lineWidth=3;c.lineCap='round';c.lineJoin='round';
  let len=0,lp=null,minx=1e9,maxx=-1e9,done=false;const st=pressed();onStage('pointerdown',e=>{lp=sp(e)});
  onStage('pointermove',e=>{if(!st.down||done)return;const p=sp(e);if(p.x<px||p.x>px+pw||p.y<py||p.y>py+ph){lp=null;return}if(lp){c.beginPath();c.moveTo(lp.x,lp.y);c.lineTo(p.x,p.y);c.stroke();len+=dist(lp.x,lp.y,p.x,p.y)}lp=p});
  const t=tools(['서명 완료',()=>{if(done)return;if(len<need){say(len<30?'서명란에 서명해주세요.':'점 하나는 서명이 아니에요.');return}
    done=true;t.remove();const fin=()=>{say('계약 성립. 이제 버튼을 누를 권리가 생겼어요.');const b=add(realBtn('계약완료','pop'));pos(b,W()/2,H()-62);b.style.scale=.6};
    {fin();return}const mk=add(el('div','inmark','(인)'));pos(mk,px+pw-40,py+ph-30);const sx=60,sy=H()-60;const stp=add(el('div','stampx','도장'));pos(stp,sx,sy);say('서명 다음은 도장이죠. (인) 자리에 찍어주세요.');
    drag(stp,{end:(x,y)=>{if(dist(x,y,gx(mk),gy(mk))<34){stp.remove();mk.classList.add('done');mk.textContent='버튼';fin()}else springBack(stp,sx,sy)}})},'primary'],['지우기',()=>{if(done)return;c.clearRect(0,0,W(),H());len=0;minx=1e9;maxx=-1e9}]);
  say('서명란에 서명하고 서명 완료를 누르세요.');
}},
{name:'버튼 생일',story:'오늘은 버튼 생일이에요. 촛불을 꺼주세요.',run(lv){const B=mkB(lv);const n=B(3,6,10),re=B(0,.35,.6);const cx=W()/2,cy=H()*.62;
  const ck=sprite('cake',200,cx,cy);ck.style.pointerEvents='none';let left=n;
  for(let i=0;i<n;i++){const x=cx-62+(n>1?i*124/(n-1):62);const c=add(el('button','candle','<b></b>'));pos(c,x,cy-34);c.setAttribute('aria-label','촛불');let relit=0;
    c.onclick=()=>{if(c.classList.contains('out')||!left)return;c.classList.add('out');left--;say(left?`후~ 남은 초 ${left}개`:'다 껐어요! 생일 축하해, 버튼아.');
      if(!left){after(400,()=>{const b=add(realBtn('고마워','pop'));pos(b,cx,cy-140)});return}
      if(relit<2&&Math.random()<re){relit++;after(1200,()=>{if(left&&c.classList.contains('out')){c.classList.remove('out');left++;say('장난감 초였어요! 다시 켜졌어요.')}})}}}
  say('촛불을 눌러서 꺼주세요.');
}},
{name:'두더지 잡기',story:'버튼이 두더지들 사이에 숨었어요.',run(lv){const B=mkB(lv);const need=B(1,3,5),up=B(1000,750,560);
  const holes=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++){const x=(c+.5)*W()/3,y=90+r*125;add(el('div','hole'));const h=stage.lastChild;pos(h,x,y+32);holes.push({x,y,e:null})}
  let hits=0;const pop=()=>{if(won)return;const hs=holes.filter(h=>!h.e);if(!hs.length)return;const h=pick(hs);const isB=Math.random()<.3;
    const e=isB?add(realBtn('','mini')):sprite('mole',62,0,0);if(isB){e.style.width=e.style.height='62px';e.locked=true}pos(e,h.x,h.y+40);e.style.transition='top .15s';e.style.zIndex=2;h.e=e;
    requestAnimationFrame(()=>requestAnimationFrame(()=>pos(e,h.x,h.y)));
    e.addEventListener('pointerdown',()=>{if(e.dataset.hit||won)return;e.dataset.hit=1;if(isB){hits++;if(hits>=need){win('두더지 사이에서 버튼을 잡았습니다.<br>아무 일도 일어나지 않았습니다.');return}say(`잡았다! (${hits}/${need})`)}else{say('그건 두더지예요!');if(lv===2)hits=0}pos(e,h.x,h.y+40);after(150,()=>{e.remove();h.e=null})});
    after(up*(lv===2&&isB?.7:1),()=>{if(h.e===e){pos(e,h.x,h.y+40);after(160,()=>{e.remove();if(h.e===e)h.e=null})}})};
  every(Math.round(up*.55),()=>{if(holes.filter(h=>!h.e).length>5)pop()});
  say(`튀어나오는 버튼을 ${need}번 잡으세요. 두더지는 말고요.`);
}},
{name:'짝 맞추기',story:'버튼이 카드 속에 숨었어요. 짝을 다 맞춰야 나와요.',run(lv){const B=mkB(lv);const p=B(3,5,8),cols=B(3,4,4);
  const I=shuffle(['apple','cherry','sock','key','banana','potato','pizza','egg','bread','ladybug']).slice(0,p);const deck=shuffle([...I,...I]);
  const g=add(el('div','grid mem'));g.style.gridTemplateColumns=`repeat(${cols},1fr)`;let open=[],done=0,lock=false;
  deck.forEach(k=>{const c=add(el('button','mcard','?'),g);c.onclick=()=>{if(lock||c.classList.contains('up'))return;c.classList.add('up');c.innerHTML=ART[k];open.push([c,k]);
    if(open.length===2){const [[a,ka],[b2,kb]]=open;open=[];if(ka===kb){done++;a.classList.add('ok');b2.classList.add('ok');say(done<p?`짝! (${done}/${p})`:'다 맞췄어요!');if(done===p)after(500,()=>{g.remove();const b=add(realBtn('짝짝짝','pop'));center(b)})}
      else{lock=true;after(B(900,750,550),()=>{[a,b2].forEach(x=>{x.classList.remove('up');x.textContent='?'});lock=false})}}}});
  say('같은 그림 카드를 짝지어 뒤집으세요.');
}},
{name:'버튼 따라하기',story:'버튼이 보여주는 순서를 따라 하세요.',run(lv){const B=mkB(lv);const L=B(3,5,7);const cols=['#F0533D','#6E7CF2','#FFD23F','#5FB59A'];
  const g=add(el('div','grid2'));g.style.gridTemplateColumns='1fr 1fr';const pads=cols.map(c=>{const p=add(el('button','pad'),g);p.style.background=c;return p});
  let seq=[],inp=0,busy=true;const mk=()=>{seq=[...Array(L)].map(()=>Math.floor(Math.random()*4))};mk();
  const flash=(i,ms=380)=>{pads[i].classList.add('lit');after(ms,()=>pads[i].classList.remove('lit'))};
  const play=()=>{busy=true;inp=0;say('잘 보세요…');seq.forEach((v,k)=>after(600+k*600,()=>flash(v)));after(600+L*600,()=>{busy=false;say('이제 따라 하세요.')})};
  pads.forEach((p,i)=>p.onclick=()=>{if(busy)return;flash(i,200);if(seq[inp]===i){inp++;if(inp>=L){busy=true;say('완벽해요!');after(400,()=>{g.remove();const b=add(realBtn('기억력 갑','pop'));center(b)})}}else{busy=true;say('틀렸어요. 다시 보여줄게요.');if(lv===2)mk();after(800,play)}});
  after(300,play);
}},
{name:'시간 여행',story:'버튼은 정해진 시각에만 나타나요.',run(lv){const B=mkB(lv);const tol=B(20,5,0);const tg=Math.floor(rnd(0,1440));const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  bubble('버튼 출몰 시각 '+fmt(tg),16);const disp=add(el('div','clock','12:00'));
  const wrap=add(el('div','tools'));const minus=add(el('button','tool','−1분'),wrap);const r=add(el('input','range'),wrap);r.type='range';r.min=0;r.max=1439;r.value=tg<720?1200:240;r.id='timeslider';r.setAttribute('aria-label','시각');const plus=add(el('button','tool','+1분'),wrap);
  const b=add(realBtn('있다!'));pos(b,W()/2,H()*.56);b.style.opacity=0;b.style.pointerEvents='none';
  const upd=()=>{const v=+r.value;disp.textContent=fmt(v);const ok=Math.abs(v-tg)<=tol;b.style.opacity=ok?1:Math.abs(v-tg)<60?.12:0;b.style.pointerEvents=ok?'':'none';say(ok?'버튼이 나타났어요!':Math.abs(v-tg)<60?'근처예요. 버튼 그림자가 보여요.':'버튼이 없는 시간이에요.')};
  r.addEventListener('input',upd);minus.onclick=()=>{r.value=Math.max(0,+r.value-1);upd()};plus.onclick=()=>{r.value=Math.min(1439,+r.value+1);upd()};upd();
}},
{name:'버튼 자판기',story:'버튼이 자판기 안에 들어갔어요. 거스름돈이 안 나오는 자판기래요.',run(lv){
  const WAL=[{500:1,100:4,50:2},{500:2,100:3,50:3,10:4},{500:2,100:4,50:3,10:6}][lv];const vals=Object.keys(WAL).map(Number).sort((a,b)=>b-a);
  const all=[];vals.forEach(v=>{for(let k=0;k<WAL[v];k++)all.push(v)});const tot=all.reduce((a,b)=>a+b,0);let price=0;
  for(let tries=0;tries<200;tries++){const n=Math.floor(rnd(lv===0?2:3,lv===0?5:7));const pick2=shuffle(all.slice()).slice(0,n);price=pick2.reduce((a,b)=>a+b,0);if(price!==tot&&price%500!==0&&price>=[300,600,800][lv]&&(lv===0||pick2.includes(10)||pick2.includes(50)))break}
  const vm=add(el('div','vend',`<div class="vwin"><span class="cbtn"></span></div><div class="vlbl">버튼 ${price.toLocaleString()}원<br><small>거스름돈 없음</small></div>`));pos(vm,W()/2-70,H()*.34);
  const slot=add(el('div','vslot','투입구'));pos(slot,W()/2+86,H()*.27);const sum=add(el('div','sign','0원'));pos(sum,W()/2+86,H()*.27+48);
  let s=0,fin=false;const cnt=Object.assign({},WAL);const stacks={};
  const upd=()=>{vals.forEach(v=>{const e=stacks[v];e.querySelector('b').textContent='×'+cnt[v];e.classList.toggle('empty',!cnt[v])});sum.textContent=s.toLocaleString()+'원'};
  const refund=m=>{s=0;Object.assign(cnt,WAL);upd();if(m)say(m)};
  vals.forEach((v,i)=>{const x=(i+.5)*W()/vals.length,y=H()-108;const c=add(el('div','coin'+(v===500?' big5':v===10?' c10':''),`${v}<b></b>`));pos(c,x,y);stacks[v]=c;
    drag(c,{start:()=>{if(!cnt[v]){say(`${v}원짜리가 다 떨어졌어요.`)}},end:(cx,cy)=>{springBack(c,x,y);if(fin||!cnt[v]||dist(cx,cy,gx(slot),gy(slot))>=55)return;cnt[v]--;s+=v;upd();
      if(s>price){awk(`${s.toLocaleString()}원… 넘었어요! 거스름돈이 없어서 전부 돌려드려요.`);refund();return}
      if(s===price){fin=true;say('덜컹! 딱 맞췄어요.');vm.querySelector('.cbtn').style.visibility='hidden';stage.querySelectorAll('.coin').forEach(e=>e.remove());tl.remove();const b=add(realBtn('꺼내줘','pop'));pos(b,W()/2,H()-90);b.style.scale=.75}
      else say(`짤랑. ${(price-s).toLocaleString()}원 더.`)}})});
  const tl=tools(['반환',()=>{if(!fin)refund('동전을 전부 돌려받았어요.')}]);upd();
  say('지갑 속 동전으로 딱 맞게 넣으세요. 넘으면 다 돌려줘요.');
}},
{name:'무궁화 꽃이',story:'버튼이 무궁화꽃이 피었습니다를 하재요. 술래 몰래 버튼을 결승선까지 옮겨주세요.',run(lv){const B=mkB(lv);const red=B(1300,1700,2200),gm=B(1.4,1,.7);
  const doll=sprite('dollBack',90,W()-52,86);doll.style.pointerEvents='none';const fl=add(el('div','tugline'));fl.style.left=(W()-90)+'px';
  const sx=56,y=H()*.62;const b=add(realBtn('살금','mid'));pos(b,sx,y);b.locked=true;let looking=false,t=rnd(1500,3000)*gm,gT=t,phase='g',bx=sx,done=false;
  const ph='무궁화꽃이피었습니다';
  drag(b,{set:false,move:x=>{if(done)return;const nx=Math.max(sx,Math.min(W()-40,x));if(looking&&Math.abs(nx-bx)>3){bx=sx;pos(b,bx,y);miss();say('움직였어요! 처음으로.');shake(b);return}bx=nx;pos(b,bx,y);if(bx>=W()-90){done=true;after(250,()=>unlock(b,'도착','통과! 술래가 못 봤어요.'))}}});
  loop(dt=>{if(done)return false;t-=dt;if(phase==='g'){say('술래: '+ph.slice(0,Math.ceil((1-Math.max(0,t)/gT)*ph.length)));if(t<=0){phase='r';looking=true;doll.innerHTML=ART.dollFront;t=red*rnd(.8,1.2);say('술래가 봐요! 멈춰!')}}
    else if(t<=0){phase='g';looking=false;doll.innerHTML=ART.dollBack;t=gT=rnd(1500,3200)*gm}});
  b.addEventListener('click',()=>{if(b.locked&&!done)say('점선까지 끌고 가야 해요.')});
}},
{name:'비 오는 날',story:'비가 와요. 버튼이 젖지 않게 우산을 씌워주세요.',run(lv){const B=mkB(lv);const need=B(2000,4000,6000),v=B(.025,.05,.08);const by=H()*.65;
  const [cv,c]=mkCanvas();cv.style.zIndex=1;const cl=sprite('rainCloud',130,W()/2,40);cl.style.pointerEvents='none';
  const b=add(realBtn('추워','mid'));pos(b,W()/2,by);b.locked=true;const um=sprite('umbrella',110,70,H()-60);um.style.zIndex=6;drag(um);
  const pb=add(el('div','mbar','<i></i>')),pi=pb.querySelector('i');let x=W()/2,a=0,dry=0,fin=false;const drops=[...Array(60)].map(()=>[rnd(0,W()),rnd(0,H())]);
  loop(dt=>{if(fin)return false;a+=rnd(-.05,.05);x+=Math.cos(a)*v*dt;if(x<60||x>W()-60){a=Math.PI-a;x=Math.max(60,Math.min(W()-60,x))}pos(b,x,by);pos(pb,x,by+64);
    const ux=gx(um),uy=gy(um);const cov=Math.abs(ux-x)<50&&uy<by-30&&uy>by-180;dry=cov?dry+dt:Math.max(0,dry-dt*.5);pi.style.width=Math.min(100,dry/need*100)+'%';
    c.clearRect(0,0,W(),H());c.strokeStyle='#5E95CC';c.lineWidth=2;c.beginPath();drops.forEach(d=>{d[1]+=dt*.5;d[0]-=dt*.05;if(d[1]>H()){d[1]=rnd(-40,0);d[0]=rnd(0,W()+40)}if(Math.abs(d[0]-ux)<48&&d[1]>uy-10&&d[1]<H())return;c.moveTo(d[0],d[1]);c.lineTo(d[0]-3,d[1]+12)});c.stroke();
    if(dry>=need){fin=true;cv.remove();pb.remove();cl.remove();unlock(b,'고마워','비가 그쳤어요. 버튼이 감동받았어요.')}});
  b.addEventListener('click',()=>{if(b.locked)say('비 맞는 중이라 눌릴 기분이 아니래요.')});say('우산을 끌어서 버튼 위에 계속 씌워주세요.');
}},
{name:'버튼 키우기',story:'버튼이 씨앗이 됐어요. 키워주세요.',run(lv){const B=mkB(lv);const wt=B(1000,1600,2500),nc=B(1,3,5);const cx=W()/2,py=H()-80;
  const pot=sprite('pot',110,cx,py);pot.style.pointerEvents='none';sprite('sun',70,W()-60,60).style.pointerEvents='none';
  const can=sprite('can',84,70,H()*.42);let step=0,wa=0,held=false,da=0;drag(can,{start:()=>held=true,end:()=>held=false});
  const grow=()=>{step=2;say('햇빛을 받고 자라는 중…');const s4=sprite('sprout',80,cx,py-62);s4.style.pointerEvents='none';
    after(B(1500,2500,3500),()=>{s4.remove();const st=add(el('div','stem'));pos(st,cx,py-52);const b=add(realBtn('피었다','pop mid'));pos(b,cx,py-120);say('버튼 꽃이 피었어요!')})};
  const cloudsUp=()=>{step=1;say('물 줬어요! 이제 구름을 눌러 치우고 해를 비춰주세요.');let left=nc;
    for(let i=0;i<nc;i++){const c=sprite('cloud',96,W()-70+rnd(-50,20),46+i*14);let back=lv===2;
      c.onclick=()=>{c.style.transition='left .5s,opacity .5s';const y=gy(c);pos(c,-80,y);c.style.opacity=0;c.style.pointerEvents='none';
        if(back){back=false;after(1400,()=>{c.style.opacity=1;pos(c,W()-70,y);c.style.pointerEvents='';say('구름이 다시 왔어요!')});return}left--;if(!left)grow();else say(`남은 구름 ${left}개`)}}};
  loop(dt=>{if(step>0)return false;const nx=gx(can)+84*.38,ny=gy(can)-84*.24;if(held&&Math.abs(nx-cx)<50&&ny<py-20&&ny>py-160){wa+=dt;da+=dt;if(da>120){da=0;const d=sprite('drop',16,nx,ny);d.style.pointerEvents='none';d.style.transition='top .4s ease-in,opacity .4s';requestAnimationFrame(()=>requestAnimationFrame(()=>{pos(d,nx-8,py-40);d.style.opacity=0}));setTimeout(()=>d.remove(),420)}}
    if(wa>=wt){can.remove();cloudsUp()}});
  say('물뿌리개를 끌어서 화분 위에서 물을 주세요.');
}},
{name:'구겨진 버튼',story:'버튼이 빨래 바구니에서 구겨졌어요.',run(lv){const B=mkB(lv);const hp=B(60,130,220);const cx=W()/2,cy=H()/2-10,N=6,S3=180,cs=S3/N;
  const b=add(realBtn('꾸깃'));pos(b,cx,cy);b.locked=true;const cells=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=cx-S3/2+(c+.5)*cs,y=cy-S3/2+(r+.5)*cs;if(dist(x,y,cx,cy)>S3/2)continue;const e=add(el('div','wrink'));e.style.width=e.style.height=cs+2+'px';pos(e,x,y);e.style.rotate=rnd(0,180)+'deg';cells.push({e,h:hp,x,y})}
  const ir=sprite('iron',90,W()-60,H()-60);let lx=0,ly=0;
  drag(ir,{start:()=>{lx=gx(ir);ly=gy(ir)},move:(x,y)=>{const d=dist(x,y,lx,ly);lx=x;ly=y;cells.forEach(c=>{if(c.h>0&&dist(c.x,c.y,x,y+10)<40){c.h-=d;c.e.style.opacity=Math.max(0,c.h/hp);if(c.h<=0)c.e.remove()}});
    if(b.locked&&cells.every(c=>c.h<=0)){ir.remove();unlock(b,'빳빳','쫙 펴졌어요. 새 옷 입은 기분이래요.')}}});
  if(lv===2)every(1500,()=>{if(!b.locked)return;const c=pick(cells.filter(c=>c.h<=0));if(c){c.h=hp*.5;add(c.e);c.e.style.opacity=.5;say('다시 구겨졌어요!')}});
  b.addEventListener('click',()=>{if(b.locked)say('구겨져서 안 눌려요.')});say('다리미를 끌어서 주름을 문질러 펴주세요.');
}},
{name:'색칠 공부',story:'버튼 색이 다 빠졌어요. 색칠해주세요.',run(lv){const B=mkB(lv);const br=B(18,13,9),need=B(.75,.86,.94);const cx=W()/2,cy=H()/2-10,R=75;
  const g=add(el('div','dashc'));pos(g,cx,cy);g.style.width=g.style.height=R*2+'px';const [cv,c]=mkCanvas();c.strokeStyle='#F0533D';c.lineWidth=br*2;c.lineCap='round';c.lineJoin='round';
  const pts=[];for(let x=-R;x<=R;x+=10)for(let y=-R;y<=R;y+=10)if(x*x+y*y<(R-6)*(R-6))pts.push([cx+x,cy+y]);
  const st=pressed();let lp=null,done=false;onStage('pointerdown',e=>{lp=sp(e)});
  onStage('pointermove',e=>{if(!st.down||done)return;const p=sp(e);c.beginPath();c.moveTo((lp||p).x,(lp||p).y);c.lineTo(p.x,p.y);c.stroke();lp=p});
  every(400,()=>{if(done)return;let k=0;pts.forEach(([x,y])=>{if(alpha(c,x,y)>100)k++});const f=k/pts.length;
    if(f>=need){done=true;cv.remove();g.remove();const b=add(realBtn('알록','pop'));pos(b,cx,cy);b.style.width=b.style.height=R*2+'px';say('색칠 완료! 삐져나간 건 못 본 척할게요.')}else if(f>.2&&Math.random()<.3)say(pick(['칠하는 중…','조금만 더 꼼꼼히.','빈틈이 보여요.']))});
  say('점선 동그라미 안을 빨갛게 꽉 채워 칠하세요.');
}},
{name:'놀아줘 강아지',story:'강아지가 버튼 위에서 놀아달래요. 지칠 때까지 놀아주세요.',run(lv){const B=mkB(lv);const need=B(2,3,5);const cx=W()/2,cy=H()/2;
  const b=add(realBtn());center(b);b.locked=true;const dg=sprite('dog',92,cx,cy-10);dg.style.pointerEvents='none';const bl=sprite('ball',40,cx+70,cy+80);
  let vx=0,vy=0,throws=0,state='wait',hist=[],dspd=.28;
  drag(bl,{start:()=>{hist=[]},move:(x,y)=>{hist.push([x,y,performance.now()]);if(hist.length>5)hist.shift()},end:(x,y)=>{if(state!=='wait')return;const h0=hist[0];if(!h0)return;const dt=Math.max(16,performance.now()-h0[2]);vx=(x-h0[0])/dt;vy=(y-h0[1])/dt;if(Math.hypot(vx,vy)<.3){say('휙 던져야 해요!');return}state='chase';say('멍! 강아지가 공을 쫓아가요.')}});
  const toward=(tx,ty,sp,dt)=>{const x=gx(dg),y=gy(dg),d=dist(x,y,tx,ty);if(d<1)return 0;const k=Math.min(1,sp*dt/d);pos(dg,x+(tx-x)*k,y+(ty-y)*k);dg.style.scale=tx>x?'-1 1':'1 1';return d};
  loop(dt=>{if(state==='done')return false;
    if(state==='chase'){let x=gx(bl)+vx*dt,y=gy(bl)+vy*dt;if(x<20||x>W()-20){vx*=-1;x=Math.max(20,Math.min(W()-20,x))}if(y<20||y>H()-20){vy*=-1;y=Math.max(20,Math.min(H()-20,y))}vx*=.992;vy*=.992;pos(bl,x,y);
      const d=toward(x,y,dspd,dt);if(d<24){state='ret';bl.style.visibility='hidden'}}
    else if(state==='ret'||state==='rush'){const d=toward(cx,cy-10,state==='rush'?.6:.3,dt);if(d<8){if(state==='rush'){state='wait';bl.style.visibility='';pos(bl,cx+60,cy+80);vx=vy=0;return}throws++;bl.style.visibility='';pos(bl,cx+60,cy+80);
        if(throws>=need){state='done';dg.innerHTML=ART.dogSleep;dg.style.transition='left .6s,top .6s';pos(dg,W()-60,H()-60);bl.remove();unlock(b,'누르기','강아지가 지쳐서 잠들었어요. 쉿.')}else{state='wait';say(`또 던져달래요! (${throws}/${need})`)}}}});
  b.addEventListener('pointerdown',()=>{if(!b.locked||won)return;if(state==='chase'||state==='ret'){state='rush';bl.style.visibility='hidden';awk('몰래 누르려는 걸 강아지가 눈치챘어요! 후다닥 돌아왔어요.')}else say('강아지가 버튼 위에 앉아 있어요.')});
  say('공을 잡고 휙 던지세요. 강아지가 지칠 때까지 놀아줘요.');
}},
{name:'탁구 한 판',story:'문어를 탁구로 이기면 버튼을 돌려준대요.',run(lv){const B=mkB(lv);const need=B(3,6,10),pw=B(110,85,62),v0=[.2,.3,.42][lv];
  const pd=add(el('div','paddle'));pd.style.width=pw+'px';let px=W()/2;const py=H()-40;pos(pd,px,py);const bl=add(el('div','pball'));const op=sprite('octo',66,W()/2,38);op.style.pointerEvents='none';
  let x,y,vx,vy,hits=0,fin=false;const serve=()=>{x=W()/2;y=90;const a=rnd(.5,.9)*(Math.random()<.5?-1:1);vx=Math.sin(a)*v0;vy=Math.cos(a)*v0};serve();
  const mv=e=>{px=Math.max(pw/2,Math.min(W()-pw/2,sp(e).x));pos(pd,px,py)};onStage('pointermove',mv);onStage('pointerdown',mv);
  loop(dt=>{if(fin)return false;x+=vx*dt;y+=vy*dt;if(x<10||x>W()-10){vx*=-1;x=Math.max(10,Math.min(W()-10,x))}if(y<72&&vy<0){vy*=-1;pos(op,Math.max(40,Math.min(W()-40,x)),38)}
    if(vy>0&&y>py-18&&y<py+6&&Math.abs(x-px)<pw/2+8){vy=-Math.abs(vy)*(lv===2?1.07:1.03);vx+=(x-px)/pw*.2;hits++;say(`딱! (${hits}/${need})`);
      if(hits>=need){fin=true;bl.remove();pd.remove();op.innerHTML=ART.octoSad;const b=add(realBtn('졌다','pop'));center(b);say('문어가 졌어요. 약속대로 버튼을 돌려줬어요.');return}}
    if(y>H()+20){if(lv>0)hits=lv===2?0:Math.max(0,hits-1);say('놓쳤어요!');serve()}pos(bl,x,y)});
  say('화면을 좌우로 움직여서 라켓으로 공을 받아치세요.');
}},
{name:'계단 오르기',story:'버튼이 계단 꼭대기에 있어요. 엘리베이터는 고장.',run(lv){const B=mkB(lv);const n=B(8,15,25),back=B(0,1,3);const y0=H()-80;
  const sw=(W()-90)/n,sh=Math.min(26,(H()-190)/n);const [cv,c]=mkCanvas();cv.style.zIndex=1;c.fillStyle='#B8BFD6';c.strokeStyle='#2A2340';c.lineWidth=3;
  c.beginPath();c.moveTo(20,y0);for(let i=0;i<n;i++){c.lineTo(20+i*sw,y0-(i+1)*sh);c.lineTo(20+(i+1)*sw,y0-(i+1)*sh)}c.lineTo(20+n*sw,y0);c.closePath();c.fill();c.stroke();
  const b=add(realBtn('','mini'));pos(b,20+n*sw+30,y0-n*sh-28);b.locked=true;const me=sprite('fan',44,0,0,ART.fan('#2A2340'));me.style.pointerEvents='none';me.style.transition='left .15s,top .15s';me.style.zIndex=4;
  let s=0,lastF=null;const place=()=>pos(me,20+(Math.max(0,s-1)+.5)*sw,y0-s*sh-24);place();
  const step=f=>{if(!b.locked)return;if(f===lastF){s=Math.max(0,s-back);place();say(back?`같은 발 두 번! 미끄러졌어요. (${s}/${n})`:'같은 발 두 번이에요. 번갈아 디뎌요.');shake(me);lastF=null;return}lastF=f;s++;place();say(`${s} / ${n} 계단`);if(s>=n)unlock(b,'','꼭대기 도착! 헉헉. 버튼을 누르세요.')};
  tools(['왼발',()=>step('L')],['오른발',()=>step('R')]);
  b.addEventListener('click',()=>{if(b.locked)say('계단을 다 올라가야 닿아요.')});say('왼발, 오른발을 번갈아 누르며 올라가세요.');
}},
{name:'나무에 걸린 버튼',story:'버튼이 나무에 걸렸어요. 새총으로 떨어뜨리세요.',run(lv){const B=mkB(lv);const hr=B(42,32,24),wind=lv===2?rnd(.00006,.00012)*(Math.random()<.5?-1:1):0;
  const tr=add(el('div','tree'));pos(tr,W()-90,H()*.36);const bx=W()-90+rnd(-30,30),by=H()*.24+rnd(-15,15);const b=add(realBtn('','mini'));pos(b,bx,by);b.locked=true;b.style.zIndex=3;
  const rx=80,ry=H()-120;const ly=layer();ly.style.zIndex=4;const e1=line(ly,'band'),e2=line(ly,'band');const fork=add(el('div','fork'));pos(fork,rx,ry+40);
  const pb=add(el('div','pebble'));pos(pb,rx,ry);let fly=false,vx=0,vy=0;const band=()=>{setLine(e1,rx-24,ry,gx(pb),gy(pb));setLine(e2,rx+24,ry,gx(pb),gy(pb))};band();
  if(wind)bubble(wind>0?'바람 →':'← 바람',14);
  drag(pb,{set:false,move:(x,y)=>{if(fly)return;let dx=x-rx,dy=y-ry;const d=Math.hypot(dx,dy);if(d>95){dx*=95/d;dy*=95/d}pos(pb,rx+dx,ry+dy);band()},
    end:()=>{if(fly)return;vx=(rx-gx(pb))*.012;vy=(ry-gy(pb))*.012;if(Math.hypot(vx,vy)<.2){pos(pb,rx,ry);band();return}fly=true;setLine(e1,rx-24,ry,rx,ry);setLine(e2,rx+24,ry,rx,ry)}});
  loop(dt=>{if(!b.locked)return false;if(!fly)return;vy+=.0009*dt;vx+=wind*dt;const x=gx(pb)+vx*dt,y=gy(pb)+vy*dt;pos(pb,x,y);
    if(dist(x,y,bx,by)<hr){fly=false;pb.remove();b.classList.remove('mini');b.style.width=b.style.height='';setLabel(b,'아야');b.style.transition='top .7s cubic-bezier(.5,0,.7,1.3),left .7s';pos(b,W()/2,H()*.55);after(700,()=>unlock(b,null,'맞혔다! 버튼이 떨어졌어요.'));return false}
    if(y>H()+20||x<-20||x>W()+20){fly=false;pos(pb,rx,ry);band();say(pick(['빗나갔어요.','조금 더 세게!','아깝다!']))}});
  say('돌멩이를 뒤로 당겼다 놓아서 나무 위 버튼을 맞히세요.');
}},
{name:'풍선 속 버튼',story:'버튼이 풍선 하나에 숨었어요.',run(lv){const B=mkB(lv);const n=B(6,9,14),need=B(3,6,10),v=B(.04,.06,.09);const C=['#6E7CF2','#F2B544','#5FB59A','#E8A0B4','#B07CE0'];
  let pops=0,fin=false;const bs=[];
  for(let i=0;i<n;i++){const s=sprite('x',62,rnd(40,W()-40),rnd(80,H()+80),ART.balloonC(pick(C)));s.dataset.v=rnd(.7,1.3);
    s.addEventListener('pointerdown',()=>{if(fin||s.dataset.p)return;pops++;if(pops>=need){fin=true;const x=gx(s),y=gy(s);s.remove();const b=add(realBtn('여기','pop mid'));pos(b,x,y);b.style.transition='top .8s cubic-bezier(.5,0,.7,1.3)';after(40,()=>pos(b,x,H()-70));say('펑! 버튼이 나왔어요!');return}
      s.dataset.p=1;s.style.transition='scale .15s,opacity .15s';s.style.scale=1.5;s.style.opacity=0;say(pick(['펑! 꽝.','펑! 비었어요.','펑! 다음 풍선!']));after(220,()=>{s.dataset.p='';s.style.transition='';s.style.scale=1;s.style.opacity=1;pos(s,rnd(40,W()-40),H()+60)})});bs.push(s)}
  loop(dt=>{if(fin)return false;bs.forEach(s=>{if(!s.isConnected)return;let y=gy(s)-v*dt*s.dataset.v;if(y<-60)pos(s,rnd(40,W()-40),H()+60);else pos(s,gx(s)+Math.sin(y*.02)*.3,y)})});
  say('풍선을 터뜨려서 버튼을 찾으세요.');
}},
{name:'떨어지는 버튼',story:'하늘에서 버튼이 떨어져요. 바구니로 받으세요.',run(lv){const B=mkB(lv);const need=B(1,2,3),v=[.12,.19,.29][lv],junk=B(.4,.55,.7);const JN={sock:'양말',banana:'바나나',potato:'감자',key:'열쇠',bread:'빵'};
  const bk=add(el('div','basket'));let bx=W()/2;const by=H()-40;pos(bk,bx,by);let got=0,fin=false,items=[],acc=0;
  const mv=e=>{bx=Math.max(50,Math.min(W()-50,sp(e).x));pos(bk,bx,by)};onStage('pointermove',mv);onStage('pointerdown',mv);
  loop(dt=>{if(fin)return false;acc+=dt;if(acc>B(1100,900,700)){acc=0;const isB=Math.random()>junk;const jk=pick(Object.keys(JN));const e=isB?add(el('div','cbtn fallb')):sprite(jk,42,0,0);pos(e,rnd(30,W()-30),-30);e.style.pointerEvents='none';items.push({e,isB,jk})}
    for(let i=items.length-1;i>=0;i--){const it=items[i];const y=gy(it.e)+v*dt*(it.isB?1:1.1);pos(it.e,gx(it.e),y);
      if(y>by-22&&y<by+10&&Math.abs(gx(it.e)-bx)<52){it.e.remove();items.splice(i,1);if(it.isB){got++;say(`받았다! (${got}/${need})`);if(got>=need){fin=true;items.forEach(t=>t.e.remove());bk.remove();const b=add(realBtn('안전착지','pop'));center(b);return}}else{say(`${JN[it.jk]}${(w=>{const c=w.charCodeAt(w.length-1);return (c-0xAC00)%28?'을':'를'})(JN[it.jk])} 받았어요… 이건 버튼이 아니에요.`);if(lv===2)got=Math.max(0,got-1)}}
      else if(y>H()+30){it.e.remove();items.splice(i,1);if(it.isB)say('버튼을 놓쳤어요!')}}});

}},
{name:'버튼 증명사진',story:'버튼이 증명사진을 찍고 싶대요. 근데 가만히 있지를 않아요.',run(lv){const P=[[170,100,.09,1],[140,86,.15,2],[124,76,.2,3]][lv];const [fs,bs,v,need]=P;const tol=(fs-bs)/2;const fy=H()*.42;
  const fr=add(el('div','frame'));fr.style.width=fr.style.height=fs+'px';pos(fr,W()/2,fy);const b=add(realBtn('치즈','mid'));b.style.width=b.style.height=bs+'px';b.style.fontSize=Math.round(bs*.2)+'px';b.locked=true;
  let ph=0,th=rnd(0,Math.PI),x=W()/2,y=fy,shots=0,fin=false;const m=bs/2+8;const HP=[2200,1800,1500][lv],R=[100,120,135][lv];let wob=0;
  loop(dt=>{if(fin)return false;const prev=Math.sin(ph);ph+=dt*Math.PI/HP;const sn=Math.sin(ph);if(prev*sn<=0&&prev!==0){th=rnd(0,Math.PI);wob=rnd(-6,6)}
    const d=R*sn;x=W()/2+Math.cos(th)*d-Math.sin(th)*wob;y=fy+Math.sin(th)*d+Math.cos(th)*wob;x=Math.max(m,Math.min(W()-m,x));y=Math.max(m,Math.min(H()-80-m,y));pos(b,x,y)});
  const t=tools(['찰칵',()=>{if(fin)return;const fl=add(el('div','flash'));after(300,()=>fl.remove());
    if(Math.abs(x-W()/2)<tol&&Math.abs(y-fy)<tol){
      if(Math.random()<.03){D.blink=(D.blink||0)+1;saveD();checkTitles();say('완벽한 구도인데… 버튼이 눈 감았대요! 다시 찍어요.');return}
      shots++;if(shots>=need){fin=true;t.remove();fr.remove();pos(b,W()/2,fy);unlock(b,'고마워','완벽한 증명사진! 버튼이 만족했어요.')}else say('잘 나왔어요! 한 장 더.')}
    else say(pick(['반만 나왔어요.','흔들렸어요.','버튼이 프레임 밖이에요.']))},'primary']);
  b.addEventListener('click',()=>{if(b.locked)say('사진부터 찍어달래요.')});say('버튼이 점선 네모 안에 딱 들어왔을 때 찰칵!');
}},
{name:'무단횡단 금지',story:'버튼이 길 건너편에 있어요. 차 조심!',run(lv){const B=mkB(lv);const nl=B(2,3,5),sp5=B(.1,.15,.22);
  const top=60,bot=H()-70,lh=(bot-top)/nl;const road=add(el('div','road'));road.style.top=top+'px';road.style.height=(bot-top)+'px';
  const cars=[];const C=['#6E7CF2','#F2B544','#5FB59A','#E8A0B4','#B07CE0'];
  for(let l=0;l<nl;l++){const dir=l%2?-1:1,y=top+(l+.5)*lh,k=lv===0?1:2,v=sp5*rnd(.8,1.3);for(let j=0;j<k;j++){const c=sprite('x',84,(j/k)*W()+rnd(0,60),y,ART.car(pick(C)));c.style.pointerEvents='none';c.style.scale=dir<0?'-1 1':'1 1';cars.push({e:c,dir,v})}}
  bubble('건너편',8);const b=add(realBtn('건너자','mini'));const sx=W()/2,sy=H()-36;pos(b,sx,sy);b.locked=true;b.style.width=b.style.height='56px';let fin=false,hl=false;
  drag(b,{set:false,move:(x,y)=>{if(!hl&&!fin)pos(b,x,y)},end:()=>{hl=false;if(fin)return;if(gy(b)<top-5){fin=true;cars.forEach(c=>{c.e.style.transition='opacity .4s';c.e.style.opacity=0;setTimeout(()=>c.e.remove(),400)});after(250,()=>{b.classList.remove('mini');b.style.width=b.style.height='';setLabel(b,'누르기');b.style.transition='left .4s,top .4s';pos(b,W()/2,H()/2);unlock(b,null,'건넜어요! 손 들고 건너는 거 잊지 마세요.')})}}});
  loop(dt=>{if(fin)return false;cars.forEach(c=>{let x=gx(c.e)+c.dir*c.v*dt;if(x>W()+60)x=-60;if(x<-60)x=W()+60;pos(c.e,x,gy(c.e));if(!hl&&Math.abs(x-gx(b))<46&&Math.abs(gy(c.e)-gy(b))<28){hl=true;pos(b,sx,sy);say('빵빵! 처음으로 돌아가요.')}})});
  say('버튼을 끌어서 차를 피해 위쪽 건너편까지 가세요.');
}},
{name:'낯가리는 버튼',story:'버튼이 낯을 가려요. 가만히 기다려주세요.',run(lv){const B=mkB(lv);const need=B(5000,10000,20000);
  const b=add(realBtn('…','mid'));center(b);b.locked=true;const bb=bubble('',20);let t=0,fin=false,bait=null;
  const reset=m=>{if(fin)return;t=0;say(m||'건드리면 놀라요! 처음부터.');shake(b)};onStage('pointerdown',()=>reset());
  if(lv===2)every(3500,()=>{if(fin||bait)return;bait=tools(['지금 누르세요!',()=>{if(bait){bait.remove();bait=null}reset('함정이었어요. 처음부터.')}]);after(1800,()=>{if(bait){bait.remove();bait=null}})});
  loop(dt=>{if(fin)return false;t+=dt;bb.textContent=['쉿…','…','쉿.'][Math.floor(t/1500)%3];if(t>=need){fin=true;bb.textContent='이제 괜찮아요';if(bait)bait.remove();setLabel(b,'안녕');unlock(b,null,'버튼이 마음을 열었어요. 살살 눌러주세요.')}});
  say(`${need/1000}초 동안 아무것도 건드리지 마세요.`);
}},
{name:'병에 낀 버튼',story:'버튼이 유리병에 들어갔다가 끼었어요.',run(lv){const B=mkB(lv);const need=B(10,20,35);

{name:'버튼 경매',story:'버튼이 경매에 나왔어요. 지갑 사정은 넉넉하지 않아요.',run(lv){const B=mkB(lv);
